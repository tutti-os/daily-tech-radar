name: Backfill Daily Trend Data 2026-08-20 to 2026-08-27

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-2026-08-20-27.yml"

concurrency:
  group: generate-daily-data-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    if: "${{ contains(github.event.head_commit.message, 'chore(actions): run historical data backfill') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test generator and SDK
        run: pnpm -r test

      - name: Generate and commit historical data
        env:
          PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          dates=(
            2026-08-20
            2026-08-21
            2026-08-22
            2026-08-23
            2026-08-24
            2026-08-25
            2026-08-26
            2026-08-27
          )

          for date in "${dates[@]}"; do
            pnpm generate -- --source producthunt --date "$date"
            pnpm generate -- --source github --date "$date"
            git add data
            if git diff --cached --quiet; then
              echo "No generated changes for $date"
              continue
            fi
            git commit -m "chore(data): backfill daily data for $date"
            git push origin HEAD:main
          done
