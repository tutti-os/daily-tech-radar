name: Publish SDK to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with.
        required: false
        default: latest
        type: string
      dry_run:
        description: Run publish in dry-run mode without uploading to npm.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build SDK
        run: pnpm --filter @tutti-os/daily-tech-radar build

      - name: Verify SDK package metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("packages/sdk/package.json", "utf8"));
          if (pkg.name !== "@tutti-os/daily-tech-radar") {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (pkg.private) {
            throw new Error("SDK package is marked private.");
          }
          NODE

      - name: Check npm version availability
        if: ${{ inputs.dry_run == false }}
        working-directory: packages/sdk
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already exists on npm. Bump packages/sdk/package.json before publishing."
            exit 1
          fi

      - name: Publish SDK
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          args=(--access public --tag "${{ inputs.npm_tag }}" --no-git-checks)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--provenance)
          fi
          pnpm publish "${args[@]}"
